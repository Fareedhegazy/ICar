name: Deploy AI server

# Deploys the icar-ai Supabase Edge Function and stores the Claude API key on Supabase.
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   Secrets:   SUPABASE_ACCESS_TOKEN, ANTHROPIC_API_KEY
#   Variables: SUPABASE_PROJECT_REF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-ai.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Store the Claude API key on Supabase
        run: supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
      - name: Deploy the icar-ai function
        run: supabase functions deploy icar-ai --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
