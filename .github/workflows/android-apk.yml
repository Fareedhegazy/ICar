name: Android APK

# Builds an installable test APK with no Expo account needed.
# Download it from the run's "Artifacts" section or from the "apk-latest" release.
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Deploy AI server"]
    types: [completed]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ICar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ICar-apk
          path: ICar.apk
      - name: Publish to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ICar (نسخة تجربة)
          body: نسخة تجربة لأندرويد. نزّل ملف ICar.apk على الموبايل وسطّبه.
          prerelease: true
          files: ICar.apk
